source = ~/.config/hypr/colors/colors-lock.conf

# GENERAL
general {
    disable_loading_bar = false
    no_fade_in = false
    grace = 0
}

# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 8
    noise = 0.01
    contrast = 1.0
    brightness = 0.8
    vibrancy = 0.2
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "<span>$(date +"%H:%M")</span>"
    color = $fgsoft
    font_size = 85
    font_family = SF Pro Display Bold
    position = 0, -120
    halign = center
    valign = top
}

# DATE 
label {
    monitor = 
    text = cmd[update:43200000] echo -e "$(date +"%A, %B %d")"
    color = $fgsoft
    font_size = 25
    font_family = SF Pro Display Semibold
    position = 0, -80
    halign = center
    valign = top
}

# USER
label {
  monitor =
  text = $USER
  color = $fgsoft
  font_size = 20
  font_family = SF Pro Text Semibold
  position = 0, 150
  halign = center
  valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 170, 45
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 1)
    font_color = $fgsoft
    font_family = SF Pro Text Semibold
    fade_on_empty = false
    placeholder_text = <span foreground="##$fgsoftAlpha">Enter Password</span>
    hide_input = false
    position = 0, 80
    halign = center
    valign = bottom
}
