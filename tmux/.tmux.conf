unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-a

set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


set -g base-index 1

# ~/.tmux.conf

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

set-option -g status-justify left
set -g status-left-length 85
set -g status-style 'bg=default,fg=#fff4d2'
set-option -g status-right '#[bg=#a9b665 , fg=#000000,bold] #S '
set-option -g status-left ''

set -g window-status-format "#[fg=#fff4d2,bg=#484848,bold]  #I #[fg=#222222,bg=#a89984,bold] #W "
set -g window-status-current-format "#[fg=#000000,bg=#a9b665,bold]  #I #[fg=#000000,bg=#83a598 ,bold] #W "

set -g message-style bg=#a9b665,fg=#1d1d1d,bold
set -g message-command-style bg=#1d1d1d,fg=#a9b665,bold

set -g pane-active-border-style fg=#a9b665
set -g pane-border-style fg=#484848

