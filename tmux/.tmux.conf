set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'

unbind r
bind r source-file ~/.tmux.conf

# Prefix
set -g prefix C-Space

# Binds
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours
set -g base-index 1
set -g allow-passthrough on
set -g mouse on

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

set-option -g status-justify left
set -g status-left-length 85
set -g status-style 'bg=default,fg=#d4be98'
set-option -g status-right '#[bg=#83a598 , fg=#000000,bold] #S '
set-option -g status-left ''

set -g window-status-format "#[fg=#d4be98,bg=#484848,bold]  #I #[fg=#222222,bg=#a89984,bold] #W "
set -g window-status-current-format "#[fg=#000000,bg=#83a598,bold]  #I #[fg=#d4be98,bg=#504945,bold] #W "

set -g message-style bg=#83a598,fg=#1d1d1d,bold
set -g message-command-style bg=#1d1d1d,fg=#83a598,bold

set -g pane-active-border-style fg=#83a598
set -g pane-border-style fg=#484848

