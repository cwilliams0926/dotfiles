source = ~/.config/hypr/colors/colors-lock.conf
source = ~/.config/hypr/colors/wallpaper.conf

$font = SF Pro Display

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = true
}

# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 8
    noise = 0.01
    contrast = 1.0
    brightness = 0.8
    vibrancy = 0.2
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
    color = $fgsoft
    font_size = 90
    font_family = $font
    position = 0, 0
    halign = center
    valign = top
}

# DATE 
label {
    monitor = 
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $fgsoft
    font_size = 25
    font_family = $font
    position = 0, -150
    halign = center
    valign = top
}

# USER AVATAR

image {
    monitor = 
    path = ~/.face
    size = 100
    border_color = $accent

    position = 0, 75
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    inner_color = $bg
    font_color = $fgsoft
    fade_on_empty = false
    placeholder_text = <span foreground="##$fgsoftAlpha"><i>󰌾  Logged in as </i><span foreground="##$blueAlpha">$USER</span></span>
    hide_input = false
    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $accent
    position = 0, 35
    halign = center
    valign = bottom
}
